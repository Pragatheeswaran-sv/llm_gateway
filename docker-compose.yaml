services:
  fastapi:
    build:
      context: .
      dockerfile: dockerfile
    container_name: fastapi_llm_gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/.venv
    command: poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
