[tool.poetry]
name = "LLM gateway "
version = "0.1.0"
description = ""
readme = "README.md"
authors = ["Pragatheeswaran-sv <pragatheeswaran.s@mitrahsoft.in>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.52.3"}
sqlalchemy = "^2.0.52"
python-dotenv = "^1.2.3"
psycopg = {extras = ["binary"], version = "^3.3.4"}
alembic = "^1.19.1"
mysql-connector-python = "^26.7.0"
pyodbc = "^5.3.0"
openai = "^3.14.0"
anthropic = "^1.5.0"
httpx = "^0.28.1"
pydantic = "^2.13.5"
pydantic-settings = "^2.15.0"
cryptography = "^50.0.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.0"
httpx = "^0.28.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that make external service calls",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"